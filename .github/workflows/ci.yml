name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    name: Windows · GCC (w64devkit)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/*.cmake') }}
      - name: Install w64devkit
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe -OutFile w64devkit.exe
          ./w64devkit.exe "-o$env:RUNNER_TEMP" -y | Out-Null
          "$env:RUNNER_TEMP\w64devkit\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure
        shell: pwsh
        env: { CC: gcc, CXX: g++ }
        run: cmake --preset default
      - name: Build
        shell: pwsh
        run: cmake --build build
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark on a test photo
        shell: pwsh
        run: |
          $p = Start-Process build\bin\mausely.exe -ArgumentList '--image', '.deps\testimages\victory.jpg', '--benchmark', '90' -NoNewWindow -Wait -PassThru -RedirectStandardOutput bench.txt
          Get-Content bench.txt
          if ($p.ExitCode -ne 0) { throw "benchmark failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: mausely-win64-gcc
          path: |
            build/bin/mausely.exe
            build/bin/onnxruntime.dll
            build/bin/models/

  msvc:
    name: Windows · MSVC 2022
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/*.cmake') }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        env: { CC: cl, CXX: cl }
        run: cmake --preset default
      - name: Build
        shell: pwsh
        run: cmake --build build
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

  linux:
    # The portable core (everything the Android app shares with Windows) and its tests.
    name: Linux · core tests (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('cmake/*.cmake') }}
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android:
    name: Android · APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-android-${{ hashFiles('cmake/*.cmake', 'android/app/build.gradle.kts') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APKs
        # AGP installs the pinned NDK, CMake and SDK platform on first use.
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mausely-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  python:
    name: Training pipeline · Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy onnx onnxruntime pytest
      - name: Test
        run: python -m pytest -q
