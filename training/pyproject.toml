[project]
name = "mausely-train"
version = "0.1.0"
description = "Training pipeline for Mausely's gesture classifier and motion smoother"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mausely_train"]
